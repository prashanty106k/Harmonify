# Include inside your HTTPS server block. Set root to the deployed dist folder.
root /var/www/novatech-apps/dist;
index index.html;
location ~ ^/[^/]+/app-ads\.txt$ { return 301 /app-ads.txt; }
location = /harmonify { return 301 /aura-music-player/; }
location ~ ^/harmonify/(.*)$ { return 301 /aura-music-player/$1; }
location = /app-ads.txt { default_type text/plain; }
location / { try_files $uri $uri/ =404; }
error_page 404 /404.html;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
