[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/:app/app-ads.txt"
  to = "/app-ads.txt"
  status = 301
  force = true

[[redirects]]
  from = "/harmonify/*"
  to = "/aura-music-player/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/cinemora/*"
  to = "/cinematic-pro/:splat"
  status = 301
  force = true
